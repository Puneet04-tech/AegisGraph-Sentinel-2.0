# GitHub Actions Workflow: Issue Closed Comment
name: Issue Closed Comment

# Trigger execution whenever an issue transitions to the 'closed' state
on:
  issues:
    types: [closed]

# Minimum required permissions to post comments on repository issues
permissions:
  issues: write

jobs:
  comment-on-close:
    name: Comment on Issue Closure
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Execute GitHub Script to post the automated response
      - name: Post Closing Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Extract issue context parameters
            const issue = context.payload.issue;
            const creator = issue.user.login;

            // Construct the Markdown message body for AegisGraph Sentinel 2.0
            const commentBody = `### ✅ Issue Resolved & Closed

            Thank you, @${creator}, for your contributions to **AegisGraph Sentinel 2.0**! 🚀
                                  
            Your support helps us keep our fraud detection platform robust and secure. If you discover new edge cases, performance bottlenecks, or have ideas for enhancements, feel free to open a new issue.
                                  
            Happy coding! 🛡️`;

            // Call GitHub API to post the comment
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              
              issue_number: issue.number,
              body: commentBody
            });

            
