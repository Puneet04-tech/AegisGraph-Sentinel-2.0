name: Duplicate Issue Detector

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  check-duplicate:
    runs-on: ubuntu-latest
    steps:
      # gh resolves the repository through git, so the job needs a checkout even
      # though every call passes --repo. Without it gh exits 1 with
      # "fatal: not a git repository".
      - uses: actions/checkout@v4

      - name: Check for Duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # Search for issues with similar titles (case-insensitive)
          SIMILAR_ISSUES=$(gh issue list \
            --repo "$REPO" \
            --search "\"$ISSUE_TITLE\" in:title" \
            --state all \
            --limit 10 \
            --json number,title \
            --jq '.[] | select(.number != (env.ISSUE_NUMBER | tonumber)) | .number')
          
          if [ -n "$SIMILAR_ISSUES" ]; then
            FIRST_DUPLICATE=$(echo "$SIMILAR_ISSUES" | head -1)
            gh issue comment "$ISSUE_NUMBER" \
              --body "🤖 This appears to be a duplicate of #$FIRST_DUPLICATE. Please check the original thread."
            gh issue edit "$ISSUE_NUMBER" --add-label "duplicate"
          fi
